{
    "replaces" : {
        "basename" : "IceDb",
        "startdbname" : "MAIN"
    },
    "gui" : {
        "machlabel"  : "HSPW",
        "language" : "DEU"
    },
    "database" : {
        "startupname" : "<startdbname>",
        "filename"   : "${AppData}/<basename>/<startdbname>/IceDb.sqlite",
        "tryinits"   : true,
        "dbglevel_values":"DATAFILL, STMTS, NONE",
        "dbglevel"   : "NONE"
    },
     "archivestore" : {
        "path" : "${AppData}/<basename>/<startdbname>/Archive",
        "dirnum" : 20,
        "localtemp" : "<basename>"
    },
    "backup":
    {
        "sourcepath" : "${AppData}/<basename>",
        "zipname" : "IceDb_${DbName}_${CreaDate}.zip"
    },
    "logging":
    {
        "filename" : "${AppData}/<basename>/IceDb.log",
        "maxbytes": 5000000,
        "level" : "DEBUG"     
    }
}
